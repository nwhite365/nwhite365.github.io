<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <style>
    .bg { fill: #171717; rx: 120px; transition: fill 0.3s; }
    .border { stroke: #7c2d12; stroke-width: 12; fill: none; rx: 120px; }
    .text { font-family: 'Cormorant Garamond', Georgia, serif; font-size: 240px; font-weight: 700; fill: #faf8f5; letter-spacing: -6px; }
    .accent { fill: #d97706; }
    
    @media (prefers-color-scheme: light) {
      .bg { fill: #1c1917; }
      .text { fill: #fdfcf9; }
      .accent { fill: #f59e0b; }
    }
  </style>
  
  <!-- Rounded Base Badge -->
  <rect class="bg" x="16" y="16" width="480" height="480" rx="120" />
  <rect class="border" x="22" y="22" width="468" height="468" rx="114" />
  
  <!-- Editorial Monogram Initials (NTW) -->
  <g transform="translate(256, 325)">
    <text class="text" text-anchor="middle">NT<tspan class="accent">W</tspan></text>
  </g>
</svg>
